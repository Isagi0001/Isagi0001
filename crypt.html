<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кристальный склеп</title>
<style>
  html, body { margin: 0; height: 100%; background: #05050a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16)); cursor: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
</style>
</head>
<body>
<div id="wrap"><canvas id="gl" width="320" height="180"></canvas><canvas id="hud" width="1280" height="720"></canvas></div>

<script id="fs" type="x-shader/x-fragment">
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 vUv;
uniform sampler2D uAlb, uDat, uMap;   // colour, (height, surface kind, emission), wall grid
uniform vec2 uCam, uMapSize;
uniform vec3 uLP[16], uLC[16];        // light: xy world position, z radius / rgb colour
uniform float uTime, uHurt, uFade;
const vec2 RES = vec2(320., 180.);

float b2(vec2 a) { a = floor(a); return fract(a.x / 2. + a.y * a.y * .75); }
float bayer(vec2 a) { return b2(.5 * a) * .25 + b2(a); }
float solid(vec2 w) { return texture2D(uMap, w / (16. * uMapSize)).r; }
float lum(vec2 p) { return dot(texture2D(uAlb, (p + .5) / RES).rgb, vec3(.333)); }

void main() {
  vec2 px = floor(vUv * RES);
  vec4 d = texture2D(uDat, (px + .5) / RES);
  float h = d.r * 255. / 8., kind = d.g, em = d.b;
  bool flat_ = kind < .1, top = kind > .2 && kind < .3, front = kind > .45 && kind < .55, water = kind > .9;
  // Every pixel is projected back onto the ground plane: screen y + height.
  vec2 g = uCam + px + .5 + vec2(0., h);
  vec2 sp = px;
  if (water) sp += floor(vec2(sin(g.y * .45 + uTime * 2.2), cos(g.x * .4 + uTime * 1.8)) * 1.5 + .5);
  vec3 alb = texture2D(uAlb, (sp + .5) / RES).rgb;
  // Relief normal derived from the pixel art itself.
  vec2 gr = vec2(lum(sp + vec2(1., 0.)) - lum(sp - vec2(1., 0.)), lum(sp + vec2(0., 1.)) - lum(sp - vec2(0., 1.)));
  vec3 n = normalize(vec3(-gr * 3., 1.));
  float dth = bayer(px);

  vec3 lit = vec3(.06, .07, .13), haze = vec3(0.);
  float spec = 0.;
  for (int i = 0; i < 16; i++) {
    vec3 L = uLP[i];
    if (L.z <= 0.) continue;
    vec2 dv = L.xy - g;
    float dist = length(dv);
    if (dist >= L.z) continue;
    float att = 1. - dist / L.z; att *= att;
    haze += uLC[i] * att * att * .07;
    float f = 1.;
    if (top) f = .75;                       // wall tops sit above every occluder
    else {
      if (front) f = clamp(dv.y / 6., 0., 1.);   // south faces only catch light from the south
      if (f > 0.) for (int s = 0; s < 16; s++) { // dithered shadow ray through the wall grid
        if (solid(g + dv * ((float(s) + dth) / 16.)) > .5) { f = 0.; break; }
      }
    }
    if (flat_ || top || water) f *= clamp(dot(n, normalize(vec3(dv, 26.))) * 1.3, 0., 1.4);
    lit += uLC[i] * att * f * 1.7;
    spec += att * f;
  }
  vec3 col = alb * lit;
  if (water) {
    float w = sin(g.x * .9 + g.y * .35 + uTime * 3.) * sin(g.y * 1.1 - uTime * 2.);
    col += step(.8, w) * spec * vec3(.5, .7, .9);
  }
  col = mix(col, alb * 1.25, em) + haze;
  vec2 q = vUv - .5;
  col *= 1. - dot(q, q) * .9;
  col = mix(col, vec3(.85, .05, .05), clamp(uHurt * dot(q, q) * 2.5, 0., 1.));
  col *= uFade;
  // Ordered-dither posterise in perceptual space.
  col = sqrt(clamp(col, 0., 1.));
  col = floor(col * 11. + dth) / 11.;
  gl_FragColor = vec4(col * col, 1.);
}
</script>

<script>
'use strict';
const VW = 320, VH = 180, TS = 16, WALL_H = 12, MW = 44, MH = 32;
const params = new URLSearchParams(location.search), DEMO = params.has('demo');
const glCv = document.getElementById('gl'), hudCv = document.getElementById('hud'), hud = hudCv.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const ctxOf = c => { const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return x; };
const albCv = mk(VW, VH), a = ctxOf(albCv), datCv = mk(VW, VH), d = ctxOf(datCv);
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
const hsh = (x, y) => { let n = Math.imul(x, 374761393) + Math.imul(y, 668265263); n = Math.imul(n ^ (n >>> 13), 1274126177); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; };
let seed = DEMO ? 4242 : (Date.now() & 0x7fffffff);
const rnd = () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const ri = n => Math.floor(rnd() * n);

/* ---------- WebGL ---------- */
const gl = glCv.getContext('webgl', { antialias: false, alpha: false });
let glErr = '', U = {}, texAlb, texDat, texMap;
function initGL() {
  if (!gl) { glErr = 'WebGL недоступен'; return; }
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) glErr = gl.getShaderInfoLog(s); return s; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, 'attribute vec2 p; varying vec2 vUv; void main(){ vUv = vec2(p.x * .5 + .5, .5 - p.y * .5); gl_Position = vec4(p, 0., 1.); }'));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
  gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) { glErr = glErr || gl.getProgramInfoLog(pr); return; }
  gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  for (const n of ['uAlb', 'uDat', 'uMap', 'uCam', 'uMapSize', 'uLP', 'uLC', 'uTime', 'uHurt', 'uFade']) U[n] = gl.getUniformLocation(pr, n);
  const tex = unit => { const t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
    for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.NEAREST], [gl.TEXTURE_MAG_FILTER, gl.NEAREST], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
    return t; };
  texAlb = tex(0); texDat = tex(1); texMap = tex(2);
  gl.uniform1i(U.uAlb, 0); gl.uniform1i(U.uDat, 1); gl.uniform1i(U.uMap, 2);
  gl.uniform2f(U.uMapSize, MW, MH);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
}
initGL();

/* ---------- sprites ---------- */
// Each sprite has a colour image and a data image: R = height above ground * 8, G = surface kind, B = emission.
function mkSprite(rows, pal, emis = '', z = 0) {
  const w = rows[0].length, h = rows.length, A = mk(w, h), D = mk(w, h), ac = A.getContext('2d'), dc = D.getContext('2d');
  rows.forEach((row, y) => { for (let x = 0; x < w; x++) { const ch = row[x]; if (ch === '.') continue;
    ac.fillStyle = pal[ch]; ac.fillRect(x, y, 1, 1);
    dc.fillStyle = `rgb(${Math.min(31, h - y + z) * 8},192,${emis.includes(ch) ? 255 : 0})`; dc.fillRect(x, y, 1, 1); } });
  return { A, D, w, h };
}
const S = {
  player: mkSprite(['....hhhh....', '...hhhhhh...', '...hhhhhh...', '..hhYYYYhh..', '.hhhhhhhhhh.', '...ssssss...', '...sesses...', '...ssssss...', '..rrrrrrrr..', '.rrrrYYrrrr.', '.srrrYYrrrs.', '.srrrrrrrrs.', '..rrrrrrrr..', '..rrrrrrrr..', '..rrr..rrr..', '..bbb..bbb..'],
    { h: '#5a74f0', Y: '#ffd24a', s: '#f6c898', e: '#20202c', r: '#4458c8', b: '#5a3a28' }),
  slime: mkSprite(['....gggg....', '..ggGGgggg..', '.ggGggggggg.', '.gwkggggwkg.', 'gggggggggggg', 'gggggggggggg', 'gdggggggggdg', '.gddggggddg.', '..dddddddd..'],
    { g: '#5fd84a', G: '#b8ff9a', d: '#2f8a30', w: '#ffffff', k: '#18301a' }),
  bat: mkSprite(['p..........p', 'pp..p..p..pp', 'ppp.pppp.ppp', 'pppppRpRpppp', '.pppppppppp.', '..pp.pp.pp..'],
    { p: '#a070e8', R: '#ff5a5a' }, 'R', 8),
  skull: mkSprite(['..wwwwww..', '.wwwwwwww.', 'wwwwwwwwww', 'wkkwwwwkkw', 'wkMwwwwMkw', 'wwwwkkwwww', '.wwwwwwww.', '.wkwkwkww.', '..wwwwww..'],
    { w: '#e8e4d8', k: '#2a2030', M: '#ff4ae0' }, 'M', 4),
  crystal: mkSprite(['...cc...', '..cCCc..', '.cCWCCc.', '.cCWCCc.', 'cCCWCCCc', 'cCCCCCCc', '.cCCCCc.', '.cCCCCc.', '..cCCc..', '...cc...'],
    { c: '#38c8ff', C: '#8ae8ff', W: '#ffffff' }, 'cCW', 3),
  torch: [0, 1].map(f => mkSprite(f ? ['..y..', '.yYy.', '.oYo.', '.ooo.', '..b..', '..b..', '..b..', '..b..'] : ['.y...', '.yYy.', '.oYo.', '..oo.', '..b..', '..b..', '..b..', '..b..'],
    { y: '#ffe36a', Y: '#fffbd0', o: '#ff8a2a', b: '#7a5030' }, 'yYo', 4)),
  heart: mkSprite(['.rr.rr.', 'rRrrrrr', 'rrrrrrr', '.rrrrr.', '..rrr..', '...r...'], { r: '#ff3a50', R: '#ffc0c8' }, 'rR', 3),
};

/* ---------- state ---------- */
let map, rooms, torches, crystals, enemies, bolts, parts, pickups, portal, levelId = 0;
let floorA, floorD, rowA = [], rowD = [];
let state = DEMO ? 'play' : 'title', stateT = 0, time = 0, depth = 1, score = 0, fade = 0, shake = 0, hurtFx = 0, msg = '', msgT = 0, got = 0;
const cam = { x: 0, y: 0 };
const pl = { x: 0, y: 0, hp: 5, max: 5, inv: 0, cd: 0, dash: 0, dashCd: 0, dx: 1, dy: 0, ang: 0, walk: 0, kx: 0, ky: 0 };
const wallT = (tx, ty) => tx < 0 || ty < 0 || tx >= MW || ty >= MH || map[ty * MW + tx] === 1;
const wallAt = (x, y) => wallT(Math.floor(x / TS), Math.floor(y / TS));
const blocked = (x, y) => wallAt(x - 4, y - 3) || wallAt(x + 4, y - 3) || wallAt(x - 4, y + 3) || wallAt(x + 4, y + 3);
function move(e, dx, dy) { let hit = false; e.x += dx; if (blocked(e.x, e.y)) { e.x -= dx; hit = true; } e.y += dy; if (blocked(e.x, e.y)) { e.y -= dy; hit = true; } return hit; }
function los(x0, y0, x1, y1) { const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 5); for (let i = 1; i < n; i++) { const t = i / n; if (wallAt(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t)) return false; } return true; }

/* ---------- sound ---------- */
let actx = null;
function sfx(f, dur, type = 'square', vol = 0.05, slide = 0) {
  if (!actx) return;
  try { const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur); } catch (e) {}
}

/* ---------- level ---------- */
function genLevel() {
  map = new Uint8Array(MW * MH).fill(1); rooms = []; torches = []; crystals = []; enemies = []; bolts = []; parts = []; pickups = []; got = 0; levelId++;
  const want = 6 + Math.min(3, depth >> 1);
  for (let i = 0; i < 300 && rooms.length < want; i++) {
    const w = 5 + ri(5), h = 4 + ri(4), x = 2 + ri(MW - w - 4), y = 3 + ri(MH - h - 5);
    if (rooms.some(r => x < r.x + r.w + 2 && x + w + 2 > r.x && y < r.y + r.h + 3 && y + h + 3 > r.y)) continue;
    rooms.push({ x, y, w, h, cx: x + (w >> 1), cy: y + (h >> 1) });
  }
  rooms.sort((p, q) => p.cx - q.cx);
  for (const r of rooms) for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) map[y * MW + x] = 0;
  for (let i = 0; i + 1 < rooms.length; i++) { // 2-wide L corridors
    const p = rooms[i], q = rooms[i + 1];
    for (let x = Math.min(p.cx, q.cx); x <= Math.max(p.cx, q.cx) + 1; x++) { map[p.cy * MW + x] = 0; map[(p.cy + 1) * MW + x] = 0; }
    for (let y = Math.min(p.cy, q.cy); y <= Math.max(p.cy, q.cy) + 1; y++) { map[y * MW + q.cx] = 0; map[y * MW + q.cx + 1] = 0; }
  }
  for (const r of rooms) {
    if (rnd() < 0.6) { // puddle
      const cx = r.x + 1 + rnd() * (r.w - 2), cy = r.y + 1 + rnd() * (r.h - 2), rad = 1.2 + rnd() * 1.4;
      for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) if ((x + .5 - cx) ** 2 + (y + .5 - cy) ** 2 < rad * rad) map[y * MW + x] = 2;
    }
    for (const tx of r.w >= 7 ? [r.x + 1, r.x + r.w - 2] : [r.cx])
      if (map[(r.y - 1) * MW + tx] === 1) torches.push({ x: tx * TS + 8, y: r.y * TS + 1, ph: rnd() * 9 });
  }
  const first = rooms[0], last = rooms[rooms.length - 1];
  Object.assign(pl, { x: first.cx * TS + 8, y: first.cy * TS + 8, kx: 0, ky: 0, dash: 0 });
  portal = { x: last.cx * TS + 8, y: last.cy * TS + 8, open: false };
  const nCr = Math.min(8, 2 + depth);
  for (let i = 0; i < nCr; i++) {
    const r = rooms[1 + i % (rooms.length - 1)];
    for (let k = 0; k < 30; k++) {
      const tx = r.x + ri(r.w), ty = r.y + ri(r.h), x = tx * TS + 8, y = ty * TS + 8;
      if (Math.hypot(x - portal.x, y - portal.y) < 20 || crystals.some(c => c.x === x && c.y === y)) continue;
      crystals.push({ x, y, ph: rnd() * 6, taken: false }); break;
    }
  }
  for (const r of rooms.slice(1)) {
    const n = Math.min(5, 1 + ri(2) + (depth >> 1));
    for (let i = 0; i < n; i++) {
      const t = rnd(), type = t < 0.5 ? 'slime' : t < 0.8 || depth < 2 ? 'bat' : 'skull';
      enemies.push({ type, x: (r.x + ri(r.w)) * TS + 8, y: (r.y + ri(r.h)) * TS + 8, hp: { slime: 3, bat: 1, skull: 2 }[type], ph: rnd() * 6, cd: 1 + rnd(), awake: false, kx: 0, ky: 0, flash: 0 });
    }
  }
  buildLayers();
  if (gl && !glErr) { const m = new Uint8Array(MW * MH); for (let i = 0; i < m.length; i++) m[i] = map[i] === 1 ? 255 : 0;
    gl.activeTexture(gl.TEXTURE2); gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, MW, MH, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE, m); }
  fade = 0;
}

const shade = (c, k) => `rgb(${c.map(v => clamp(Math.round(v * k), 0, 255)).join(',')})`;
function buildLayers() {
  floorA = mk(MW * TS, MH * TS); floorD = mk(MW * TS, MH * TS);
  const fa = floorA.getContext('2d'), fd = floorD.getContext('2d');
  fd.fillStyle = '#000'; fd.fillRect(0, 0, MW * TS, MH * TS);
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const t = map[y * MW + x], px = x * TS, py = y * TS, r = hsh(x, y);
    if (t === 2) {
      fa.fillStyle = shade([44, 96, 176], 0.9 + r * 0.2); fa.fillRect(px, py, TS, TS);
      for (let i = 0; i < 4; i++) { fa.fillStyle = shade([70, 130, 210], 1); fa.fillRect(px + Math.floor(hsh(x * 3 + i, y) * 13), py + Math.floor(hsh(x, y * 5 + i) * 15), 3, 1); }
      fd.fillStyle = 'rgb(0,255,0)'; fd.fillRect(px, py, TS, TS);
    } else {
      fa.fillStyle = shade([104, 96, 128], 0.85 + r * 0.3); fa.fillRect(px, py, TS, TS);
      fa.fillStyle = shade([60, 54, 82], 1); fa.fillRect(px, py + 15, TS, 1); fa.fillRect(px + 15, py, 1, TS);
      if (r < 0.4) fa.fillRect(px, py + 7, TS, 1); else if (r < 0.6) fa.fillRect(px + 7, py, 1, TS);
      fa.fillStyle = shade([132, 124, 158], 1); fa.fillRect(px, py, 15, 1); fa.fillRect(px, py, 1, 15);
      for (let i = 0; i < 3; i++) { fa.fillStyle = shade([104, 96, 128], hsh(x + i, y - i) < .5 ? 0.7 : 1.25); fa.fillRect(px + 2 + Math.floor(hsh(x * 7 + i, y) * 11), py + 2 + Math.floor(hsh(x, y * 7 + i) * 11), 2, 1); }
    }
  }
  rowA = []; rowD = [];
  for (let y = 0; y < MH; y++) {
    const A = mk(MW * TS, TS + WALL_H), D = mk(MW * TS, TS + WALL_H), ra = A.getContext('2d'), rd = D.getContext('2d');
    for (let x = 0; x < MW; x++) {
      if (map[y * MW + x] !== 1) continue;
      const px = x * TS, r = hsh(x * 13, y * 7);
      let edge = false; for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) if (!wallT(x + i, y + j)) edge = true;
      // top face
      ra.fillStyle = edge ? shade([98, 102, 134], 0.9 + r * 0.2) : '#0e0d18'; ra.fillRect(px, 0, TS, TS);
      if (edge) {
        for (let i = 0; i < 4; i++) { ra.fillStyle = shade([98, 102, 134], hsh(x + i, y) < .5 ? 0.75 : 1.2); ra.fillRect(px + 1 + Math.floor(hsh(x * 5 + i, y) * 12), 1 + Math.floor(hsh(x, y * 3 + i) * 13), 2, 2); }
        ra.fillStyle = shade([150, 154, 186], 1);
        if (!wallT(x, y - 1)) ra.fillRect(px, 0, TS, 1); if (!wallT(x - 1, y)) ra.fillRect(px, 0, 1, TS);
        ra.fillStyle = shade([60, 62, 88], 1);
        if (!wallT(x, y + 1)) ra.fillRect(px, 15, TS, 1); if (!wallT(x + 1, y)) ra.fillRect(px + 15, 0, 1, TS);
      }
      rd.fillStyle = `rgb(${WALL_H * 8},64,0)`; rd.fillRect(px, 0, TS, TS);
      // south face: bricks
      for (let i = 0; i < WALL_H; i++) {
        ra.fillStyle = shade([150, 104, 92], (1.05 - i * 0.035) * (0.92 + hsh(x + (i >> 2) * 9, y) * 0.16)); ra.fillRect(px, TS + i, TS, 1);
        rd.fillStyle = `rgb(${(WALL_H - i) * 8},128,0)`; rd.fillRect(px, TS + i, TS, 1);
      }
      ra.fillStyle = shade([78, 54, 58], 1);
      for (let b = 0; b < 3; b++) { ra.fillRect(px, TS + b * 4 + 3, TS, 1); ra.fillRect(px + (b % 2 ? 3 : 11), TS + b * 4, 1, 3); }
    }
    rowA.push(A); rowD.push(D);
  }
}

/* ---------- helpers ---------- */
function burst(x, y, z, col, n, sp = 60) { for (let i = 0; i < n; i++) { const ang = Math.random() * 6.28, s = Math.random() * sp; parts.push({ x, y, z, vx: Math.cos(ang) * s, vy: Math.sin(ang) * s * 0.7, vz: 20 + Math.random() * 60, life: 0.3 + Math.random() * 0.4, col }); } }
let flashes = [];
function say(t) { msg = t; msgT = 2.5; }
function newGame() { depth = 1; score = 0; pl.hp = pl.max; pl.inv = 0; genLevel(); state = 'play'; stateT = 0; say('Соберите все кристаллы'); }
function hurtPlayer(fx, fy) {
  if (pl.inv > 0 || pl.dash > 0 || state !== 'play') return;
  pl.hp--; pl.inv = 1; shake = 5; hurtFx = 1; sfx(160, 0.2, 'sawtooth', 0.08, -80);
  const l = Math.hypot(pl.x - fx, pl.y - fy) || 1; pl.kx = (pl.x - fx) / l * 140; pl.ky = (pl.y - fy) / l * 140;
  burst(pl.x, pl.y, 8, '#ff4a4a', 10);
  if (pl.hp <= 0) { state = 'dead'; stateT = 0; burst(pl.x, pl.y, 8, '#5a74f0', 30, 90); sfx(220, 0.7, 'sawtooth', 0.08, -180); }
}

/* ---------- input ---------- */
const keys = new Set(), mouse = { x: 160, y: 90, down: false, used: false };
addEventListener('keydown', e => {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (err) {} }
  if (/^(Arrow|Space)/.test(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys.add(e.code);
  if ((state === 'title' && (e.code === 'Enter' || e.code === 'Space')) || (e.code === 'KeyR' && state !== 'title') || (state === 'dead' && e.code === 'Enter' && stateT > 0.5)) newGame();
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => { keys.clear(); mouse.down = false; });
function setMouse(e) { const r = hudCv.getBoundingClientRect(); mouse.x = (e.clientX - r.left) / r.width * VW; mouse.y = (e.clientY - r.top) / r.height * VH; mouse.used = true; }
hudCv.addEventListener('mousemove', setMouse);
hudCv.addEventListener('mousedown', e => {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (err) {} }
  setMouse(e); e.preventDefault();
  if (state === 'title' || (state === 'dead' && stateT > 0.5)) newGame(); else mouse.down = true;
});
addEventListener('mouseup', () => mouse.down = false);
hudCv.addEventListener('contextmenu', e => e.preventDefault());

function humanInput() {
  const k = c => keys.has(c) ? 1 : 0;
  const i = { mx: k('KeyD') - k('KeyA'), my: k('KeyS') - k('KeyW'), shoot: false, ang: pl.ang, dash: keys.has('Space') };
  const ax = k('ArrowRight') - k('ArrowLeft'), ay = k('ArrowDown') - k('ArrowUp');
  if (ax || ay) { i.ang = Math.atan2(ay, ax); i.shoot = true; }
  else if (mouse.used) { i.ang = Math.atan2(mouse.y + cam.y - (pl.y - 6), mouse.x + cam.x - pl.x); i.shoot = mouse.down; }
  return i;
}
// Autoplay for ?demo: walks a BFS path to the next crystal / portal and shoots what it sees.
let bfsKey = '', bfsD = null;
function bfs(tx, ty) {
  const key = tx + ',' + ty + ',' + levelId; if (key === bfsKey) return bfsD;
  const D = new Int16Array(MW * MH).fill(-1), q = [ty * MW + tx]; D[q[0]] = 0;
  for (let i = 0; i < q.length; i++) for (const o of [-1, 1, -MW, MW]) { const n = q[i] + o; if (map[n] !== 1 && D[n] < 0) { D[n] = D[q[i]] + 1; q.push(n); } }
  bfsKey = key; bfsD = D; return D;
}
function botInput() {
  const i = { mx: 0, my: 0, shoot: false, ang: pl.ang, dash: false };
  const tg = crystals.find(c => !c.taken) || portal;
  const D = bfs(Math.floor(tg.x / TS), Math.floor(tg.y / TS)), tx = Math.floor(pl.x / TS), ty = Math.floor(pl.y / TS), c = ty * MW + tx;
  let gx = tg.x, gy = tg.y;
  if (D[c] > 0) { let best = c; for (const o of [-1, 1, -MW, MW]) if (D[c + o] >= 0 && D[c + o] < D[best]) best = c + o; gx = (best % MW) * TS + 8; gy = Math.floor(best / MW) * TS + 8; }
  const l = Math.hypot(gx - pl.x, gy - pl.y) || 1; i.mx = (gx - pl.x) / l; i.my = (gy - pl.y) / l;
  let bd = 150, be = null;
  for (const e of enemies) { const dd = Math.hypot(e.x - pl.x, e.y - pl.y); if (dd < bd && los(pl.x, pl.y, e.x, e.y)) { bd = dd; be = e; } }
  if (be) { i.ang = Math.atan2(be.y - pl.y, be.x - pl.x); i.shoot = true; if (bd < 45) { i.mx = -Math.cos(i.ang); i.my = -Math.sin(i.ang); } }
  return i;
}

/* ---------- update ---------- */
function tick(dt) {
  time += dt; stateT += dt; fade = Math.min(1, fade + dt * 1.5); shake = Math.max(0, shake - dt * 20); hurtFx = Math.max(0, hurtFx - dt * 2); msgT -= dt;
  for (const p of parts) { p.life -= dt; p.vz -= 260 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z = Math.max(0, p.z + p.vz * dt); }
  parts = parts.filter(p => p.life > 0);
  for (const f of flashes) f.life -= dt; flashes = flashes.filter(f => f.life > 0);
  if (state === 'dead' && DEMO && stateT > 2) newGame();
  if (state !== 'play') return;

  const inp = DEMO ? botInput() : humanInput();
  pl.ang = inp.ang; pl.inv -= dt; pl.cd -= dt; pl.dashCd -= dt; pl.dash -= dt;
  let l = Math.hypot(inp.mx, inp.my);
  if (l > 0) { pl.dx = inp.mx / l; pl.dy = inp.my / l; pl.walk += dt * 10; } else pl.walk = 0;
  if (inp.dash && pl.dashCd <= 0 && l > 0) { pl.dash = 0.17; pl.dashCd = 0.8; sfx(500, 0.12, 'sine', 0.04, 500); }
  const inWater = map[Math.floor(pl.y / TS) * MW + Math.floor(pl.x / TS)] === 2;
  const sp = pl.dash > 0 ? 240 : l > 0 ? (inWater ? 52 : 74) : 0;
  move(pl, (pl.dx * sp + pl.kx) * dt, (pl.dy * sp + pl.ky) * dt);
  pl.kx *= 0.85; pl.ky *= 0.85;
  if (pl.dash > 0) parts.push({ x: pl.x, y: pl.y, z: 6, vx: 0, vy: 0, vz: 0, life: 0.25, col: '#8aa0ff' });
  if (inWater && l > 0 && Math.random() < 0.3) parts.push({ x: pl.x, y: pl.y + 2, z: 1, vx: (Math.random() - .5) * 30, vy: 0, vz: 40, life: 0.3, col: '#9ad0ff' });
  if (inp.shoot && pl.cd <= 0) {
    pl.cd = 0.26; sfx(760, 0.08, 'triangle', 0.04, -350);
    bolts.push({ x: pl.x + Math.cos(pl.ang) * 6, y: pl.y + Math.sin(pl.ang) * 6, vx: Math.cos(pl.ang) * 190, vy: Math.sin(pl.ang) * 190, life: 1.1, mine: true });
  }

  for (const e of enemies) {
    const dx = pl.x - e.x, dy = pl.y - e.y, dist = Math.hypot(dx, dy) || 1, nx = dx / dist, ny = dy / dist;
    e.flash -= dt; e.cd -= dt;
    if (!e.awake && dist < 150 && (dist < 50 || los(e.x, e.y, pl.x, pl.y))) e.awake = true;
    let vx = 0, vy = 0;
    if (e.awake) {
      if (e.type === 'slime') { const s = (24 + depth * 2) * (0.5 + Math.abs(Math.sin(time * 5 + e.ph))); vx = nx * s; vy = ny * s; }
      else if (e.type === 'bat') { const w = Math.sin(time * 5 + e.ph) * 0.9, s = 50 + depth * 2; vx = (nx - ny * w) * s; vy = (ny + nx * w) * s; }
      else {
        const s = dist > 95 ? 30 : dist < 60 ? -30 : 0; vx = nx * s; vy = ny * s;
        if (e.cd <= 0 && dist < 150 && los(e.x, e.y, pl.x, pl.y)) { e.cd = Math.max(1, 2.1 - depth * 0.1); bolts.push({ x: e.x, y: e.y, vx: nx * 72, vy: ny * 72, life: 3, mine: false }); sfx(240, 0.15, 'square', 0.03, 120); }
      }
      for (const o of enemies) if (o !== e) { const ox = e.x - o.x, oy = e.y - o.y, od = Math.hypot(ox, oy); if (od < 10 && od > 0) { vx += ox / od * 30; vy += oy / od * 30; } }
    }
    move(e, (vx + e.kx) * dt, (vy + e.ky) * dt); e.kx *= 0.85; e.ky *= 0.85;
    if (dist < 9) hurtPlayer(e.x, e.y);
  }

  for (const b of bolts) {
    b.life -= dt; b.x += b.vx * dt; b.y += b.vy * dt;
    let hit = wallAt(b.x, b.y);
    if (b.mine) { for (const e of enemies) if (!hit && Math.hypot(e.x - b.x, e.y - b.y) < 8) {
      hit = true; e.hp--; e.flash = 0.12; e.awake = true; e.kx = b.vx * 0.6; e.ky = b.vy * 0.6; sfx(300, 0.06, 'square', 0.04, -100);
      if (e.hp <= 0) { e.dead = true; score += { slime: 10, bat: 15, skull: 25 }[e.type]; burst(e.x, e.y, 6, { slime: '#5fd84a', bat: '#a070e8', skull: '#e8e4d8' }[e.type], 16, 80); sfx(140, 0.25, 'sawtooth', 0.06, -90);
        if (Math.random() < 0.14 && !DEMO || (DEMO && rnd() < 0.14)) pickups.push({ x: e.x, y: e.y }); } } }
    else if (Math.hypot(pl.x - b.x, pl.y - b.y) < 6 && pl.dash <= 0 && pl.inv <= 0) { hit = true; hurtPlayer(b.x, b.y); }
    if (hit) { b.life = 0; burst(b.x, b.y, 7, b.mine ? '#ffb040' : '#ff4ae0', 6, 50); flashes.push({ x: b.x - b.vx * dt, y: b.y - b.vy * dt, life: 0.15, col: b.mine ? [1, .6, .2] : [1, .2, .9] }); }
  }
  bolts = bolts.filter(b => b.life > 0); enemies = enemies.filter(e => !e.dead);

  for (const c of crystals) if (!c.taken && Math.hypot(c.x - pl.x, c.y - pl.y) < 10) {
    c.taken = true; got++; score += 50; burst(c.x, c.y, 8, '#8ae8ff', 18, 80); sfx(880, 0.25, 'sine', 0.07, 600);
    flashes.push({ x: c.x, y: c.y, life: 0.3, col: [.3, .8, 1] });
    if (got === crystals.length) { portal.open = true; say('Портал открыт!'); sfx(440, 0.5, 'triangle', 0.07, 440); }
  }
  for (const h of pickups) if (Math.hypot(h.x - pl.x, h.y - pl.y) < 9 && pl.hp < pl.max) { h.taken = true; pl.hp++; sfx(660, 0.2, 'sine', 0.06, 300); burst(h.x, h.y, 6, '#ff3a50', 8); }
  pickups = pickups.filter(h => !h.taken);
  if (portal.open && Math.hypot(portal.x - pl.x, portal.y - pl.y) < 8) {
    depth++; score += 100; pl.hp = Math.min(pl.max, pl.hp + 1); genLevel(); say('Глубина ' + depth); sfx(330, 0.5, 'sine', 0.07, 600);
  }
}

/* ---------- render ---------- */
function spr(s, x, y, flip = false, z = 0, sy = 1) {
  const dx = Math.round(x - cam.x - s.w / 2), hh = Math.max(1, Math.round(s.h * sy)), dy = Math.round(y - cam.y - z) + 3 - hh;
  for (const [c, img] of [[a, s.A], [d, s.D]]) {
    if (flip) { c.save(); c.translate(dx + s.w, dy); c.scale(-1, 1); c.drawImage(img, 0, 0, s.w, s.h, 0, 0, s.w, hh); c.restore(); }
    else c.drawImage(img, 0, 0, s.w, s.h, dx, dy, s.w, hh);
  }
}
function dot(x, y, z, col, size = 2) { // emissive pixel floating z above the ground
  const sx = Math.round(x - cam.x - size / 2), sy = Math.round(y - cam.y - z - size / 2);
  a.fillStyle = col; a.fillRect(sx, sy, size, size);
  d.fillStyle = `rgb(${Math.min(31, Math.round(z)) * 8},192,255)`; d.fillRect(sx, sy, size, size);
}
function shadow(x, y, w = 8) { const sx = Math.round(x - cam.x), sy = Math.round(y - cam.y); a.fillStyle = 'rgba(0,0,0,0.42)'; a.fillRect(sx - w / 2, sy, w, 3); a.fillRect(sx - w / 2 + 1, sy - 1, w - 2, 5); }

const LP = new Float32Array(48), LC = new Float32Array(48);
function render() {
  cam.x = Math.round(clamp(pl.x - VW / 2, 0, MW * TS - VW) + (Math.random() - .5) * shake);
  cam.y = Math.round(clamp(pl.y - VH / 2 - 6, 0, MH * TS - VH) + (Math.random() - .5) * shake);
  a.drawImage(floorA, cam.x, cam.y, VW, VH, 0, 0, VW, VH);
  d.drawImage(floorD, cam.x, cam.y, VW, VH, 0, 0, VW, VH);

  // portal: a ring of sparks on the floor
  for (let k = 0; k < 30; k++) {
    const ang = k / 30 * 6.283 + time * (portal.open ? 2.5 : 0.3) * (k % 2 ? 1 : -0.6), rr = 4 + (k % 3) * 3;
    const sx = Math.round(portal.x + Math.cos(ang) * rr - cam.x), sy = Math.round(portal.y + Math.sin(ang) * rr * 0.6 - cam.y);
    a.fillStyle = portal.open ? ['#d070ff', '#70e0ff', '#ffffff'][k % 3] : '#3c3850'; a.fillRect(sx, sy, 2, 1);
    if (portal.open) { d.fillStyle = 'rgb(0,0,255)'; d.fillRect(sx, sy, 2, 1); }
  }

  const list = [];
  const visible = (x, y) => x > cam.x - 20 && x < cam.x + VW + 20 && y > cam.y - 10 && y < cam.y + VH + 40;
  for (const t of torches) if (visible(t.x, t.y)) list.push([t.y, () => spr(S.torch[Math.floor(time * 8 + t.ph) % 2], t.x, t.y, false, 4)]);
  for (const c of crystals) if (!c.taken && visible(c.x, c.y)) { shadow(c.x, c.y, 6); list.push([c.y, () => spr(S.crystal, c.x, c.y, false, 3 + Math.sin(time * 3 + c.ph) * 1.5)]); }
  for (const h of pickups) if (visible(h.x, h.y)) { shadow(h.x, h.y, 6); list.push([h.y, () => spr(S.heart, h.x, h.y, false, 3 + Math.sin(time * 4) * 1)]); }
  for (const e of enemies) if (visible(e.x, e.y)) {
    shadow(e.x, e.y, e.type === 'bat' ? 6 : 10);
    list.push([e.y, () => {
      if (e.flash > 0) a.filter = 'brightness(3)';
      if (e.type === 'slime') spr(S.slime, e.x, e.y, false, 0, 1 + Math.sin(time * 10 + e.ph) * 0.14);
      else if (e.type === 'bat') spr(S.bat, e.x, e.y, false, 8 + Math.sin(time * 6 + e.ph) * 2, Math.sin(time * 18 + e.ph) > 0 ? 1 : 0.6);
      else spr(S.skull, e.x, e.y, pl.x < e.x, 4 + Math.sin(time * 3 + e.ph) * 1.5);
      a.filter = 'none';
    }]);
  }
  for (const b of bolts) list.push([b.y, () => { dot(b.x, b.y, 7, b.mine ? '#ffd070' : '#ff6af0', 3); dot(b.x - b.vx * 0.02, b.y - b.vy * 0.02, 7, b.mine ? '#ff8030' : '#c030c0', 2); }]);
  if (state !== 'dead') {
    shadow(pl.x, pl.y, 10);
    if (!(pl.inv > 0 && Math.floor(time * 20) % 2)) list.push([pl.y, () => {
      spr(S.player, pl.x, pl.y, Math.cos(pl.ang) < 0, pl.walk ? Math.abs(Math.sin(pl.walk)) * 1.5 : 0);
      dot(pl.x + Math.cos(pl.ang) * 8, pl.y + Math.sin(pl.ang) * 8, 7, '#fff0b0', 2); // wand tip
    }]);
  }
  list.sort((p, q) => p[0] - q[0]);

  // Walls and sprites interleaved row by row so tall walls hide what stands behind them.
  let li = 0;
  const r0 = Math.max(0, Math.floor(cam.y / TS) - 1), r1 = Math.min(MH - 1, Math.floor((cam.y + VH + WALL_H) / TS));
  for (let r = r0; r <= r1; r++) {
    const sy = r * TS - WALL_H - cam.y;
    a.drawImage(rowA[r], cam.x, 0, VW, TS + WALL_H, 0, sy, VW, TS + WALL_H);
    d.drawImage(rowD[r], cam.x, 0, VW, TS + WALL_H, 0, sy, VW, TS + WALL_H);
    while (li < list.length && list[li][0] < (r + 1) * TS) list[li++][1]();
  }
  while (li < list.length) list[li++][1]();
  for (const p of parts) dot(p.x, p.y, p.z, p.col, p.life > 0.15 ? 2 : 1);

  // lights
  const L = [];
  const fl = (ph, s) => 1 + Math.sin(time * 13 + ph) * 0.04 * s + Math.sin(time * 7.3 + ph * 2) * 0.03 * s;
  if (state !== 'dead') L.push([pl.x, pl.y - 1, 96 * fl(0, 1), 1, .84, .62]);
  for (const t of torches) L.push([t.x, t.y + 3, 84 * fl(t.ph, 1.6), 1, .5, .18]);
  for (const c of crystals) if (!c.taken) L.push([c.x, c.y, 34 + Math.sin(time * 3 + c.ph) * 5, .2, .7, 1]);
  for (const b of bolts) L.push(b.mine ? [b.x, b.y, 46, 1, .55, .18] : [b.x, b.y, 40, 1, .2, .9]);
  for (const f of flashes) L.push([f.x, f.y, 70 * (f.life / 0.3 + 0.5), ...f.col]);
  for (const h of pickups) L.push([h.x, h.y, 24, 1, .2, .25]);
  for (const e of enemies) if (e.type === 'skull') L.push([e.x, e.y, 26, .8, .15, .7]);
  if (portal.open) L.push([portal.x, portal.y, 70 + Math.sin(time * 4) * 6, .7, .35, 1]);
  const cx = cam.x + VW / 2, cy = cam.y + VH / 2;
  const near = L.filter(l => Math.abs(l[0] - cx) < VW / 2 + l[2] && Math.abs(l[1] - cy) < VH / 2 + l[2] + 16)
    .sort((p, q) => Math.hypot(p[0] - pl.x, p[1] - pl.y) - Math.hypot(q[0] - pl.x, q[1] - pl.y)).slice(0, 16);
  LP.fill(0); LC.fill(0);
  near.forEach((l, i) => { LP.set(l.slice(0, 3), i * 3); LC.set(l.slice(3), i * 3); });

  if (gl && !glErr) {
    gl.activeTexture(gl.TEXTURE0); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, albCv);
    gl.activeTexture(gl.TEXTURE1); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, datCv);
    gl.uniform2f(U.uCam, cam.x, cam.y); gl.uniform3fv(U.uLP, LP); gl.uniform3fv(U.uLC, LC);
    gl.uniform1f(U.uTime, time % 1000); gl.uniform1f(U.uHurt, hurtFx); gl.uniform1f(U.uFade, fade);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  drawHUD();
}

const FONT = '"Courier New", monospace';
function text(s, x, y, size, col = '#fff', align = 'center') {
  hud.font = `bold ${size}px ${FONT}`; hud.textAlign = align; hud.lineJoin = 'round'; hud.lineWidth = Math.max(4, size / 5);
  hud.strokeStyle = '#0a0a14'; hud.strokeText(s, x, y); hud.fillStyle = col; hud.fillText(s, x, y);
}
const HEART = ['.XX.XX.', 'XXXXXXX', 'XXXXXXX', '.XXXXX.', '..XXX..', '...X...'];
function drawHUD() {
  hud.clearRect(0, 0, 1280, 720);
  if (glErr) { hud.fillStyle = '#000'; hud.fillRect(0, 0, 1280, 720); text('Ошибка WebGL: ' + glErr.slice(0, 60), 640, 360, 24, '#ff6a6a'); return; }
  if (state === 'title') {
    hud.fillStyle = 'rgba(5,5,14,0.6)'; hud.fillRect(0, 0, 1280, 720);
    text('КРИСТАЛЬНЫЙ СКЛЕП', 640, 200, 84, '#8ae8ff');
    text('пиксельный 2.5D-данжен на шейдерах', 640, 250, 26, '#ffd24a');
    [['WASD', 'движение'], ['Мышь / стрелки', 'прицел и огненные заряды'], ['Пробел', 'рывок (неуязвимость)'], ['R', 'начать заново']]
      .forEach(([k, v], i) => { text(k, 600, 340 + i * 44, 28, '#fff', 'right'); text(v, 640, 340 + i * 44, 28, '#c8d0ff', 'left'); });
    text('Соберите все кристаллы — откроется портал на следующую глубину', 640, 550, 24, '#ffe9a0');
    if (Math.floor(time * 2) % 2) text('ENTER или клик — начать', 640, 630, 38);
    return;
  }
  for (let i = 0; i < pl.max; i++) for (let r = 0; r < 6; r++) for (let c = 0; c < 7; c++) if (HEART[r][c] === 'X') {
    hud.fillStyle = i < pl.hp ? (r === 1 && c === 1 ? '#ffc0c8' : '#ff3a50') : '#3a2030'; hud.fillRect(24 + i * 40 + c * 4, 24 + r * 4, 4, 4);
  }
  text('◆ ' + got + '/' + crystals.length, 24, 96, 30, portal.open ? '#d9a0ff' : '#8ae8ff', 'left');
  text('Глубина ' + depth, 1256, 46, 30, '#ffd24a', 'right'); text('Счёт ' + score, 1256, 84, 26, '#fff', 'right');
  if (msgT > 0 && state === 'play') { hud.globalAlpha = clamp(msgT, 0, 1); text(msg, 640, 170, 44, '#ffe9a0'); hud.globalAlpha = 1; }
  if (state === 'dead') {
    hud.fillStyle = 'rgba(20,0,5,0.55)'; hud.fillRect(0, 0, 1280, 720);
    text('ВЫ ПАЛИ', 640, 300, 90, '#ff5a5a'); text('Глубина ' + depth + ' · счёт ' + score, 640, 370, 36);
    text('R, ENTER или клик — заново', 640, 440, 28, '#c8d0ff');
  } else if (mouse.used && !DEMO) {
    const x = Math.round(mouse.x) * 4, y = Math.round(mouse.y) * 4; hud.fillStyle = '#fff0b0';
    hud.fillRect(x - 12, y - 2, 8, 4); hud.fillRect(x + 8, y - 2, 8, 4); hud.fillRect(x - 2, y - 12, 4, 8); hud.fillRect(x - 2, y + 8, 4, 8);
  }
}

/* ---------- main loop ---------- */
const STEP = 1 / 60; let last = 0, acc = 0, frames = 0;
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000 || 0); last = now;
  while (acc >= STEP) { tick(STEP); acc -= STEP; }
  render(); frames++;
  if (DEMO) document.title = JSON.stringify({ state, frames, t: +time.toFixed(1), depth, score, hp: pl.hp, crystals: got + '/' + crystals.length, enemies: enemies.length, glErr: glErr || (gl ? gl.getError() : 'nogl') });
  requestAnimationFrame(frame);
}
window.onerror = (m, s, l) => { document.title = 'ERR: ' + m + ' @' + l; };
genLevel();
if (DEMO) {
  say('Демо');
  // ?demo&ff=N fast-forwards N simulated seconds of autoplay (headless smoke test)
  for (let n = (+params.get('ff') || 0) * 60; n > 0; n--) tick(STEP);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
