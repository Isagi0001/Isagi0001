<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terraria 1v1</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d14; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    image-rendering: pixelated;
    background: #000;
  }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
'use strict';
const W = 80, H = 45, TS = 16, CW = W * TS, CH = H * TS;
const AIR = 0, DIRT = 1, GRASS = 2, STONE = 3, ORE = 4, WOOD = 5, BED = 6;
const HARD = [0, 0.2, 0.2, 0.45, 0.7, 0.28, Infinity];
const ITEMS = ['Меч', 'Лук', 'Кирка', 'Блоки', 'Бомба'];
const SWORD = 0, BOW = 1, PICK = 2, BLOCK = 3, BOMB = 4;
const WINS_NEEDED = 3, FONT = '"Trebuchet MS", Verdana, sans-serif';

const cv = document.getElementById('c'), g = cv.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const worldCv = mk(CW, CH), wg = worldCv.getContext('2d');
const bgCv = mk(CW, CH), bgg = bgCv.getContext('2d');
const params = new URLSearchParams(location.search);
const DEMO = params.has('demo');

let seed = DEMO ? 12345 : (Date.now() & 0x7fffffff);
function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
function hsh(x, y) { let n = Math.imul(x, 374761393) + Math.imul(y, 668265263); n = Math.imul(n ^ (n >>> 13), 1274126177); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

let world = new Uint8Array(W * H), surf = [], trees = [], clouds = [];
let players = [], arrows = [], bombs = [], parts = [], texts = [];
let state = 'menu', stateT = 0, banner = '', vsBot = false, time = 0, shake = 0;

/* ---------- sound ---------- */
let actx = null;
function sfx(f, d, type = 'square', vol = 0.06, slide = 0) {
  if (!actx) return;
  try {
    const o = actx.createOscillator(), a = actx.createGain(), t = actx.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    a.gain.setValueAtTime(vol, t); a.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(a); a.connect(actx.destination); o.start(t); o.stop(t + d);
  } catch (e) {}
}

/* ---------- world ---------- */
const inb = (x, y) => x >= 0 && x < W && y >= 0 && y < H;
const tile = (x, y) => inb(x, y) ? world[y * W + x] : AIR;
function solid(x, y) { if (x < 0 || x >= W || y >= H) return true; if (y < 0) return false; return world[y * W + x] !== AIR; }
function setM(x, y, t) { if (!inb(x, y) || y >= H - 1) return; world[y * W + x] = t; world[y * W + (W - 1 - x)] = t; }

// The map is mirrored around the centre so both spawns are equally fair.
function genWorld() {
  world.fill(AIR); surf = []; trees = [];
  const half = W / 2, ph = [rnd() * 6.28, rnd() * 6.28, rnd() * 6.28];
  for (let x = 0; x < half; x++) {
    let h = Math.round(22 + Math.sin(x * 0.16 + ph[0]) * 3 + Math.sin(x * 0.4 + ph[1]) * 1.4 + Math.sin(x * 0.07 + ph[2]) * 3);
    h = clamp(h, 15, 29);
    surf[x] = surf[W - 1 - x] = h;
    const dd = 3 + Math.floor(rnd() * 3);
    for (let y = h; y < H; y++) {
      const t = y === H - 1 ? BED : y === h ? GRASS : y < h + dd ? DIRT : STONE;
      world[y * W + x] = t; world[y * W + (W - 1 - x)] = t;
    }
  }
  for (let i = 0; i < 9; i++) { // dirt pockets
    const cx = Math.floor(rnd() * half), cy = 30 + Math.floor(rnd() * 13), r = 1.3 + rnd() * 1.8;
    for (let y = Math.floor(cy - r); y <= cy + r; y++) for (let x = Math.floor(cx - r); x <= cx + r; x++)
      if (x >= 0 && x < half && (x - cx) ** 2 + (y - cy) ** 2 <= r * r && tile(x, y) === STONE) setM(x, y, DIRT);
  }
  for (let i = 0; i < 3; i++) { // caves
    let cx = 3 + rnd() * (half - 3), cy = 0, a = rnd() * 6.28;
    cy = surf[Math.floor(cx)] + 6 + rnd() * 8;
    for (let s = 0; s < 34; s++) {
      for (let y = Math.floor(cy - 1.4); y <= cy + 1.4; y++) for (let x = Math.floor(cx - 1.4); x <= cx + 1.4; x++)
        if (x >= 0 && x < half && y > surf[x] + 3 && (x - cx) ** 2 + (y - cy) ** 2 <= 2) setM(x, y, AIR);
      a += (rnd() - 0.5) * 1.2; cx = clamp(cx + Math.cos(a), 1, half - 1); cy = clamp(cy + Math.sin(a) * 0.7, 20, H - 4);
    }
  }
  for (let i = 0, n = 0; i < 200 && n < 6; i++) { // life crystals
    const x = Math.floor(rnd() * half), y = 26 + Math.floor(rnd() * 17);
    if (tile(x, y) === STONE) { setM(x, y, ORE); n++; }
  }
  // floating wooden platforms
  let top = H; for (let x = 35; x < 45; x++) top = Math.min(top, surf[x]);
  for (let x = 36; x < 40; x++) setM(x, top - 6, WOOD);
  const sx = 17 + Math.floor(rnd() * 5);
  let st = H; for (let x = sx; x < sx + 5; x++) st = Math.min(st, surf[x]);
  for (let x = sx; x < sx + 5; x++) setM(x, st - 5 - Math.floor(rnd() * 2) * 0 - 1, WOOD);
  for (let x = 2; x < half - 1; x += 3 + Math.floor(rnd() * 4)) {
    if (Math.abs(x - 8) < 2 || rnd() < 0.3) continue;
    const h = 4 + Math.floor(rnd() * 4);
    let free = true; for (let y = surf[x] - h - 2; y < surf[x]; y++) if (tile(x, y) !== AIR) free = false;
    if (free) { trees.push({ x, y: surf[x], h }); trees.push({ x: W - 1 - x, y: surf[x], h }); }
  }
  wg.clearRect(0, 0, CW, CH);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) drawTile(x, y);
  drawBackground();
}

function drawTile(x, y) {
  if (!inb(x, y)) return;
  const t = world[y * W + x], px = x * TS, py = y * TS, r = hsh(x, y);
  wg.clearRect(px, py, TS, TS);
  if (t === AIR) {
    if (y > surf[x]) { // cave back wall
      wg.fillStyle = y > surf[x] + 5 ? '#2c2d35' : '#3b2a1e'; wg.fillRect(px, py, TS, TS);
      wg.fillStyle = 'rgba(0,0,0,0.18)';
      wg.fillRect(px + Math.floor(r * 10), py + Math.floor(hsh(y, x) * 10), 5, 3);
    }
    return;
  }
  const base = { [DIRT]: '#9b6a44', [GRASS]: '#9b6a44', [STONE]: '#7e8089', [ORE]: '#7e8089', [WOOD]: '#b98843', [BED]: '#2a2a33' }[t];
  wg.fillStyle = base; wg.fillRect(px, py, TS, TS);
  const dark = { [DIRT]: '#84573a', [GRASS]: '#84573a', [STONE]: '#686a73', [ORE]: '#686a73', [WOOD]: '#96692f', [BED]: '#1b1b22' }[t];
  wg.fillStyle = dark;
  if (t === WOOD) { wg.fillRect(px, py + 5, TS, 1); wg.fillRect(px, py + 11, TS, 1); wg.fillRect(px + (y % 2 ? 4 : 11), py, 1, 5); wg.fillRect(px + (y % 2 ? 10 : 5), py + 6, 1, 5); }
  else for (let i = 0; i < 4; i++) wg.fillRect(px + Math.floor(hsh(x * 7 + i, y * 3) * 13), py + Math.floor(hsh(x * 5, y * 11 + i) * 13), 3, 2);
  if (t === ORE) {
    for (let i = 0; i < 3; i++) {
      const ox = px + 2 + Math.floor(hsh(x + i * 31, y) * 9), oy = py + 2 + Math.floor(hsh(x, y + i * 17) * 9);
      wg.fillStyle = '#ff4f7b'; wg.fillRect(ox, oy, 4, 4); wg.fillStyle = '#ffc2d2'; wg.fillRect(ox, oy, 2, 2);
    }
  }
  if (t === GRASS && !solid(x, y - 1)) {
    wg.fillStyle = '#4caf3a'; wg.fillRect(px, py, TS, 5);
    wg.fillStyle = '#6bd24f'; wg.fillRect(px, py, TS, 2);
    wg.fillStyle = '#4caf3a'; wg.fillRect(px + 2 + Math.floor(r * 4), py + 5, 2, 2); wg.fillRect(px + 10, py + 5, 2, 1 + Math.floor(r * 3));
  }
  wg.fillStyle = 'rgba(0,0,0,0.28)'; // outline on edges exposed to air
  if (!solid(x, y + 1)) wg.fillRect(px, py + TS - 2, TS, 2);
  if (!solid(x - 1, y)) wg.fillRect(px, py, 1, TS);
  if (!solid(x + 1, y)) wg.fillRect(px + TS - 1, py, 1, TS);
  if (!solid(x, y - 1) && t !== GRASS) { wg.fillStyle = 'rgba(255,255,255,0.14)'; wg.fillRect(px, py, TS, 1); }
}
function setTile(x, y, t) {
  if (!inb(x, y)) return;
  world[y * W + x] = t;
  drawTile(x, y); drawTile(x - 1, y); drawTile(x + 1, y); drawTile(x, y - 1); drawTile(x, y + 1);
}

function drawBackground() {
  const gr = bgg.createLinearGradient(0, 0, 0, CH);
  gr.addColorStop(0, '#3f8fe8'); gr.addColorStop(0.55, '#a9dcff'); gr.addColorStop(1, '#e8f6ff');
  bgg.fillStyle = gr; bgg.fillRect(0, 0, CW, CH);
  bgg.fillStyle = '#fff6c8'; bgg.beginPath(); bgg.arc(1040, 110, 46, 0, 7); bgg.fill();
  bgg.fillStyle = 'rgba(255,246,200,0.25)'; bgg.beginPath(); bgg.arc(1040, 110, 70, 0, 7); bgg.fill();
  const layers = [['#8fc3e6', 300, 60, 0.006], ['#6fae9a', 350, 45, 0.011], ['#4f9a6a', 395, 30, 0.019]];
  layers.forEach(([c, by, amp, f], i) => {
    bgg.fillStyle = c; bgg.beginPath(); bgg.moveTo(0, CH);
    for (let x = 0; x <= CW; x += 8) bgg.lineTo(x, by + Math.sin(x * f + i * 2 + seed % 7) * amp + Math.sin(x * f * 2.7 + i) * amp * 0.4);
    bgg.lineTo(CW, CH); bgg.fill();
  });
}

/* ---------- entities ---------- */
function newPlayer(i) {
  return { i, name: i ? 'Игрок 2' : 'Игрок 1', color: i ? '#d8403a' : '#2f6fe0', hair: i ? '#3a2a1a' : '#e8c15a',
    x: 0, y: 0, w: 12, h: 26, vx: 0, vy: 0, onGround: false, facing: i ? -1 : 1, hp: 100, item: 0, cd: 0, swing: 0,
    inv: 0, blocks: 20, nbombs: 3, wins: 0, walk: 0, mt: -1, mp: 0, ax: 1, ay: 0, bot: false, stuck: 0, lastX: 0, bt: 0, dead: false, target: null };
}
function resetRound() {
  genWorld();
  arrows = []; bombs = []; parts = []; texts = [];
  players.forEach((p, i) => {
    const tx = i ? W - 9 : 8;
    Object.assign(p, { x: tx * TS + 2, y: surf[tx] * TS - 26.01, vx: 0, vy: 0, hp: 100, item: 0, cd: 0, swing: 0, inv: 0, blocks: 20, nbombs: 3,
      facing: i ? -1 : 1, mt: -1, mp: 0, dead: false, stuck: 0, target: null });
  });
  state = 'play'; stateT = 0;
}
function startMatch(bot) {
  vsBot = bot;
  players = [newPlayer(0), newPlayer(1)];
  players[1].bot = bot; if (bot) players[1].name = 'Бот';
  if (DEMO) { players[0].bot = true; players[0].name = 'Бот A'; players[1].name = 'Бот B'; }
  resetRound();
}

function collides(e) {
  const x0 = Math.floor(e.x / TS), x1 = Math.floor((e.x + e.w) / TS), y0 = Math.floor(e.y / TS), y1 = Math.floor((e.y + e.h) / TS);
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (solid(x, y)) return true;
  return false;
}
function moveEnt(e, dt, stepUp) {
  e.hitX = e.hitY = false;
  const ox = e.x; e.x += e.vx * dt;
  if (collides(e)) {
    let stepped = false;
    if (stepUp && e.onGround) { e.y -= TS; if (collides(e)) e.y += TS; else stepped = true; }
    if (!stepped) {
      if (e.vx > 0) e.x = Math.floor((e.x + e.w) / TS) * TS - e.w - 0.01;
      else if (e.vx < 0) e.x = (Math.floor(e.x / TS) + 1) * TS + 0.01;
      if (collides(e)) e.x = ox;
      e.hitX = true;
    }
  }
  const oy = e.y; e.y += e.vy * dt; e.onGround = false;
  if (collides(e)) {
    if (e.vy > 0) { e.y = Math.floor((e.y + e.h) / TS) * TS - e.h - 0.01; e.onGround = true; }
    else if (e.vy < 0) e.y = (Math.floor(e.y / TS) + 1) * TS + 0.01;
    if (collides(e)) e.y = oy;
    e.hitY = true;
  }
}
function burst(x, y, color, n, sp = 140) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, s = Math.random() * sp; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: 0.3 + Math.random() * 0.5, color, size: 2 + Math.random() * 2 }); }
}
const TCOL = ['', '#9b6a44', '#4caf3a', '#7e8089', '#ff4f7b', '#b98843', '#2a2a33'];

function hurt(p, dmg, kx, ky) {
  if (p.inv > 0 || p.dead || state !== 'play') return false;
  dmg = Math.round(dmg);
  p.hp = Math.max(0, p.hp - dmg); p.inv = 0.3; p.vx = kx; p.vy = ky;
  burst(p.x + 6, p.y + 12, '#e02828', 10);
  texts.push({ x: p.x + 6, y: p.y - 4, txt: '-' + dmg, life: 0.8, color: '#ff5a4a' });
  sfx(180, 0.12, 'sawtooth', 0.07, -90); shake = Math.max(shake, 3);
  if (p.hp <= 0) { p.dead = true; burst(p.x + 6, p.y + 12, p.color, 26, 220); }
  return true;
}

/* ---------- input ---------- */
const keys = new Set(), pressed = new Set();
const KEYMAP = [
  { left: ['KeyA'], right: ['KeyD'], up: ['KeyW'], down: ['KeyS'], use: ['KeyF', 'Space'], next: ['KeyE'], prev: ['KeyQ'], digits: ['Digit1', 'Digit2', 'Digit3', 'Digit4', 'Digit5'] },
  { left: ['ArrowLeft'], right: ['ArrowRight'], up: ['ArrowUp'], down: ['ArrowDown'], use: ['Slash', 'Numpad0', 'ShiftRight'], next: ['Period', 'Numpad1'], prev: ['Comma', 'Numpad2'], digits: ['Digit6', 'Digit7', 'Digit8', 'Digit9', 'Digit0'] },
];
addEventListener('keydown', e => {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (err) {} }
  if (/^(Arrow|Space|Slash|Period|Comma|Numpad|Quote)/.test(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys.add(e.code); pressed.add(e.code);
  if (state === 'menu') { if (e.code === 'Enter') startMatch(false); else if (e.code === 'KeyB') startMatch(true); }
  else if (state === 'matchEnd' && e.code === 'Enter' && stateT > 0.5) state = 'menu';
  else if (e.code === 'Escape') state = 'menu';
  else if (e.code === 'KeyP' && (state === 'play' || state === 'pause')) state = state === 'play' ? 'pause' : 'play';
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
const any = l => l.some(k => keys.has(k)), anyP = l => l.some(k => pressed.has(k));

function humanInput(p) {
  const m = KEYMAP[p.i];
  if (anyP(m.next)) p.item = (p.item + 1) % 5;
  if (anyP(m.prev)) p.item = (p.item + 4) % 5;
  m.digits.forEach((k, n) => { if (pressed.has(k)) p.item = n; });
  return { left: any(m.left), right: any(m.right), up: any(m.up), down: any(m.down), use: any(m.use) };
}
function botInput(p, o, dt) {
  const i = { left: false, right: false, up: false, down: false, use: false };
  const dx = o.x - p.x, dy = o.y - p.y, ad = Math.abs(dx), dir = dx > 0 ? 'right' : 'left';
  p.bt -= dt;
  if (ad < 32 && Math.abs(dy) < 34) { p.item = SWORD; p.facing = dx > 0 ? 1 : -1; i.use = true; return i; }
  if (ad < 36 && Math.abs(dy) >= 34) {
    if (dy > 0) { p.item = PICK; i.down = true; i.use = true; }
    else { p.item = BOW; i.up = true; i.use = p.bt <= 0; if (i.use) p.bt = 0.5 + Math.random() * 0.5; }
    return i;
  }
  if (Math.abs(p.x - p.lastX) < 0.2) p.stuck += dt; else p.stuck = Math.max(0, p.stuck - dt * 2);
  p.lastX = p.x;
  i[dir] = true;
  if (p.stuck > 1.6) p.stuck = 0;
  if (p.stuck > 0.8) { p.item = PICK; i.use = true; }
  else if (p.stuck > 0.15 || (dy < -40 && ad < 140)) i.up = true;
  else if (ad > 90 && ad < 230 && p.nbombs > 0 && Math.random() < 0.004) { p.item = BOMB; i.use = true; }
  else if (ad < 460 && Math.abs(dy) < 70 && p.bt <= 0) { p.item = BOW; i.use = true; p.bt = 0.5 + Math.random() * 0.7; }
  return i;
}

/* ---------- actions ---------- */
function aimVec(p) { const l = Math.hypot(p.ax, p.ay) || 1; return [p.ax / l, p.ay / l]; }
function findMineTarget(p) {
  const [nx, ny] = aimVec(p), cx = p.x + 6, cy = p.y + 13;
  let best = null, bd = 1e9;
  for (const s of [-5.5, 5.5]) {
    const ox = cx - ny * s, oy = cy + nx * s * 1.1;
    for (let d = 2; d <= 46; d += 2) {
      const tx = Math.floor((ox + nx * d) / TS), ty = Math.floor((oy + ny * d) / TS);
      if (inb(tx, ty) && world[ty * W + tx] !== AIR) { if (d < bd && world[ty * W + tx] !== BED) { bd = d; best = [tx, ty]; } break; }
    }
  }
  return best;
}
function findPlaceTarget(p) {
  const [nx, ny] = aimVec(p), tx = Math.floor((p.x + 6 + nx * 26) / TS), ty = Math.floor((p.y + 13 + ny * 26) / TS);
  if (!inb(tx, ty) || ty >= H - 1 || world[ty * W + tx] !== AIR) return null;
  for (const q of players) if (q.x < tx * TS + TS && q.x + q.w > tx * TS && q.y < ty * TS + TS && q.y + q.h > ty * TS) return null;
  return [tx, ty];
}
function useItem(p, o, dt) {
  const [nx, ny] = aimVec(p), cx = p.x + 6, cy = p.y + 11;
  if (p.item === PICK) {
    const t = findMineTarget(p);
    if (!t) { p.mt = -1; return; }
    const idx = t[1] * W + t[0], tt = world[idx];
    if (p.mt !== idx) { p.mt = idx; p.mp = 0; }
    p.mp += dt; p.swing = Math.max(p.swing, 0.08);
    if (Math.random() < 0.3) burst(t[0] * TS + 8, t[1] * TS + 8, TCOL[tt], 1, 70);
    if (((p.mp * 10) | 0) !== (((p.mp - dt) * 10) | 0)) sfx(300 + Math.random() * 80, 0.04, 'square', 0.025);
    if (p.mp >= HARD[tt]) {
      setTile(t[0], t[1], AIR); burst(t[0] * TS + 8, t[1] * TS + 8, TCOL[tt], 8);
      p.mt = -1; p.blocks++;
      if (tt === ORE) { p.hp = Math.min(100, p.hp + 25); texts.push({ x: cx, y: p.y - 6, txt: '+25', life: 1, color: '#6dff7a' }); sfx(660, 0.25, 'sine', 0.08, 500); }
    }
    return;
  }
  if (p.cd > 0) return;
  if (p.item === SWORD) {
    p.cd = 0.34; p.swing = 0.2; sfx(520, 0.09, 'triangle', 0.05, -300);
    const hx = cx + nx * 18, hy = cy + ny * 18;
    if (hx - 19 < o.x + o.w && hx + 19 > o.x && hy - 19 < o.y + o.h && hy + 19 > o.y)
      hurt(o, 18, (o.x + 6 > cx ? 1 : -1) * 270, -210);
  } else if (p.item === BOW) {
    p.cd = 0.55; sfx(700, 0.1, 'triangle', 0.05, -400);
    arrows.push({ x: cx + nx * 8, y: cy + ny * 8, vx: nx * 540, vy: ny * 540 - (ny === 0 ? 70 : 0), owner: p.i, stuck: 0 });
  } else if (p.item === BLOCK) {
    const t = p.blocks > 0 && findPlaceTarget(p);
    if (t) { setTile(t[0], t[1], WOOD); p.blocks--; p.cd = 0.13; sfx(220, 0.05, 'square', 0.04); }
  } else if (p.item === BOMB && p.nbombs > 0) {
    p.nbombs--; p.cd = 0.8; sfx(260, 0.12, 'sine', 0.05, 200);
    bombs.push({ x: cx - 4 + nx * 6, y: cy - 4 + ny * 6, w: 8, h: 8, vx: nx * 340 + p.vx * 0.5, vy: ny * 340 - 120, fuse: 1.6, onGround: false });
  }
}
function explode(b) {
  const bx = b.x + 4, by = b.y + 4, R = 44;
  for (let ty = Math.floor((by - R) / TS); ty <= Math.floor((by + R) / TS); ty++)
    for (let tx = Math.floor((bx - R) / TS); tx <= Math.floor((bx + R) / TS); tx++) {
      const t = tile(tx, ty);
      if (t !== AIR && t !== BED && Math.hypot(tx * TS + 8 - bx, ty * TS + 8 - by) <= R) { setTile(tx, ty, AIR); burst(tx * TS + 8, ty * TS + 8, TCOL[t], 3, 200); }
    }
  for (const p of players) {
    const dx = p.x + 6 - bx, dy = p.y + 13 - by, d = Math.hypot(dx, dy);
    if (d < 72) { const k = 1 - d / 72; p.inv = 0; hurt(p, 8 + 36 * k, (dx / (d || 1)) * 380 * k, -260 * k - 80); }
  }
  burst(bx, by, '#ffb23a', 30, 320); burst(bx, by, '#fff3c0', 14, 200); burst(bx, by, '#555', 14, 160);
  sfx(110, 0.45, 'sawtooth', 0.12, -70); shake = 9;
}

/* ---------- update ---------- */
function tick(dt) {
  time += dt; stateT += dt;
  clouds.forEach(c => { c.x += c.s * dt; if (c.x > CW + 120) c.x = -160; });
  shake = Math.max(0, shake - dt * 30);
  if (state === 'menu' || state === 'pause') return;
  const live = state === 'play';
  for (const p of players) {
    const o = players[1 - p.i];
    const inp = (!live || p.dead) ? { left: 0, right: 0, up: 0, down: 0, use: 0 } : p.bot ? botInput(p, o, dt) : humanInput(p);
    p.cd -= dt; p.swing -= dt; p.inv -= dt;
    const mv = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
    if (mv) p.facing = mv;
    p.ax = (mv || !(inp.up || inp.down)) ? p.facing : 0; p.ay = inp.up ? -1 : inp.down ? 1 : 0;
    p.vx += (mv * 150 - p.vx) * Math.min(1, dt * (p.onGround ? 14 : 6));
    if (inp.up && p.onGround) { p.vy = -335; sfx(330, 0.07, 'sine', 0.03, 200); }
    p.vy = Math.min(700, p.vy + 900 * dt);
    if (!p.dead) moveEnt(p, dt, true);
    if (p.onGround && Math.abs(p.vx) > 20) p.walk += dt * 14; else p.walk = 0;
    if (inp.use) useItem(p, o, dt); else p.mt = -1;
    p.target = live && !p.dead && !p.bot ? (p.item === PICK ? findMineTarget(p) : p.item === BLOCK && p.blocks > 0 ? findPlaceTarget(p) : null) : null;
  }
  for (const a of arrows) {
    if (a.stuck) { a.stuck -= dt; continue; }
    a.vy += 520 * dt; a.x += a.vx * dt; a.y += a.vy * dt;
    if (solid(Math.floor(a.x / TS), Math.floor(a.y / TS)) || a.y > CH) { a.stuck = 2.5; sfx(140, 0.04, 'square', 0.03); continue; }
    const o = players[1 - a.owner];
    if (!o.dead && a.x > o.x - 2 && a.x < o.x + o.w + 2 && a.y > o.y - 2 && a.y < o.y + o.h + 2) {
      hurt(o, 14, Math.sign(a.vx) * 200, -150); a.stuck = -1;
    }
  }
  arrows = arrows.filter(a => a.stuck >= 0 && !(a.stuck > 0 && a.stuck < 0.05));
  for (const b of bombs) {
    b.fuse -= dt; b.vy = Math.min(700, b.vy + 900 * dt);
    const pvx = b.vx, pvy = b.vy; moveEnt(b, dt, false);
    if (b.hitX) b.vx = -pvx * 0.5;
    if (b.hitY) { b.vy = -pvy * 0.35; b.vx *= 0.8; if (Math.abs(b.vy) < 40) b.vy = 0; }
    if (b.fuse <= 0) explode(b);
  }
  bombs = bombs.filter(b => b.fuse > 0);
  for (const t of trees) if (tile(t.x, t.y) === AIR) { t.gone = true; burst(t.x * TS + 8, (t.y - t.h) * TS, '#3f9a36', 18, 160); burst(t.x * TS + 8, (t.y - 2) * TS, '#7a4f2a', 8); }
  trees = trees.filter(t => !t.gone);
  for (const p of parts) { p.life -= dt; p.vy += 500 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  parts = parts.filter(p => p.life > 0);
  for (const t of texts) { t.life -= dt; t.y -= 30 * dt; }
  texts = texts.filter(t => t.life > 0);

  if (live) {
    const dead = players.filter(p => p.dead);
    if (dead.length) {
      if (dead.length === 2) banner = 'Ничья!';
      else { const w = players[1 - dead[0].i]; w.wins++; banner = w.name + ' берёт раунд!'; }
      state = 'roundEnd'; stateT = 0; sfx(440, 0.3, 'triangle', 0.08, 440);
    }
  } else if (state === 'roundEnd' && stateT > 2.4) {
    const w = players.find(p => p.wins >= WINS_NEEDED);
    if (w) { state = 'matchEnd'; stateT = 0; banner = w.name + ' — победитель!'; }
    else resetRound();
  } else if (state === 'matchEnd' && DEMO && stateT > 2) startMatch(true);
}

/* ---------- render ---------- */
function drawItem(c, item, col) {
  if (item === SWORD) { c.fillStyle = '#6b4a2a'; c.fillRect(2, -1.5, 5, 3); c.fillStyle = '#c9a23a'; c.fillRect(6, -4, 2, 8); c.fillStyle = '#dfe6ee'; c.fillRect(8, -1.5, 13, 3); c.fillStyle = '#fff'; c.fillRect(8, -1.5, 13, 1); }
  else if (item === BOW) { c.strokeStyle = '#8a5a2b'; c.lineWidth = 2.5; c.beginPath(); c.arc(4, 0, 9, -1.25, 1.25); c.stroke(); c.strokeStyle = '#eee'; c.lineWidth = 1; c.beginPath(); c.moveTo(6.8, -8.5); c.lineTo(6.8, 8.5); c.stroke(); }
  else if (item === PICK) { c.fillStyle = '#8a5a2b'; c.fillRect(2, -1.5, 17, 3); c.fillStyle = '#aeb6c2'; c.fillRect(15, -8, 4, 16); c.fillRect(12, -8, 3, 3); c.fillRect(12, 5, 3, 3); }
  else if (item === BLOCK) { c.fillStyle = '#b98843'; c.fillRect(6, -6, 12, 12); c.fillStyle = '#96692f'; c.fillRect(6, -2, 12, 1); c.fillRect(6, 3, 12, 1); c.strokeStyle = '#5e3f1a'; c.lineWidth = 1; c.strokeRect(6.5, -5.5, 11, 11); }
  else { c.fillStyle = '#25252c'; c.beginPath(); c.arc(11, 1, 6.5, 0, 7); c.fill(); c.fillStyle = '#777'; c.fillRect(9, -4, 2, 2); c.fillStyle = '#c9a23a'; c.fillRect(10, -8, 2, 3); c.fillStyle = '#ff7a2a'; c.fillRect(10, -10, 2, 2); }
}
function drawPlayer(p) {
  if (p.dead) return;
  if (p.inv > 0 && Math.floor(time * 30) % 2) g.globalAlpha = 0.45;
  const x = Math.round(p.x), y = Math.round(p.y), f = p.facing, sw = Math.sin(p.walk) * 3;
  g.fillStyle = '#2b2f4a';
  g.fillRect(x + 1, y + 18, 4, 8 - Math.max(0, sw) * 0.6); g.fillRect(x + 7, y + 18, 4, 8 - Math.max(0, -sw) * 0.6);
  g.fillStyle = p.color; g.fillRect(x, y + 9, 12, 10);
  g.fillStyle = 'rgba(0,0,0,0.2)'; g.fillRect(x, y + 17, 12, 2);
  g.fillStyle = '#f1c7a0'; g.fillRect(x + 1, y, 10, 9);
  g.fillStyle = p.hair; g.fillRect(x, y - 1, 12, 4); g.fillRect(f > 0 ? x : x + 9, y + 3, 3, 4);
  g.fillStyle = '#1a1a22'; g.fillRect(f > 0 ? x + 8 : x + 2, y + 4, 2, 2);
  let ang = Math.atan2(p.ay, p.ax);
  if (p.swing > 0) ang += (p.item === BOW ? 0 : (0.5 - p.swing / 0.2) * 1.9 * f);
  g.save(); g.translate(x + 6, y + 12); g.rotate(ang);
  drawItem(g, p.item); g.fillStyle = '#f1c7a0'; g.fillRect(0, -2, 6, 4);
  g.restore(); g.globalAlpha = 1;
}
const HEART = ['.XX.XX.', 'XXXXXXX', 'XXXXXXX', '.XXXXX.', '..XXX..', '...X...'];
function heart(x, y, frac) {
  for (let r = 0; r < 6; r++) for (let c = 0; c < 7; c++) if (HEART[r][c] === 'X') {
    g.fillStyle = c / 7 < frac ? (r === 1 && c === 1 ? '#ffb0b0' : '#e8283a') : '#3a1a22';
    g.fillRect(x + c * 3, y + r * 3, 3, 3);
  }
}
function text(s, x, y, size, col = '#fff', align = 'center') {
  g.font = `bold ${size}px ${FONT}`; g.textAlign = align; g.lineJoin = 'round';
  g.lineWidth = Math.max(3, size / 6); g.strokeStyle = '#141420'; g.strokeText(s, x, y);
  g.fillStyle = col; g.fillText(s, x, y);
}
function drawHUD() {
  players.forEach(p => {
    const left = p.i === 0, bx = left ? 14 : CW - 14 - 250;
    g.fillStyle = 'rgba(15,18,32,0.55)'; g.fillRect(bx - 6, 8, 262, 92);
    text(p.name, left ? bx : bx + 250, 28, 16, p.color === '#2f6fe0' ? '#7fb0ff' : '#ff8a80', left ? 'left' : 'right');
    for (let i = 0; i < 5; i++) heart(left ? bx + i * 25 : bx + 250 - 21 - i * 25, 36, clamp((p.hp - i * 20) / 20, 0, 1));
    text(p.hp + ' HP', left ? bx + 132 : bx + 118, 52, 13, '#fff', left ? 'left' : 'right');
    for (let i = 0; i < WINS_NEEDED; i++) text(i < p.wins ? '★' : '☆', left ? bx + 200 + i * 17 : bx + 50 - i * 17, 29, 17, '#ffd84a');
    for (let i = 0; i < 5; i++) {
      const sx = bx + i * 34, sy = 62;
      g.fillStyle = p.item === i ? 'rgba(255,216,74,0.35)' : 'rgba(40,48,90,0.75)'; g.fillRect(sx, sy, 30, 30);
      g.strokeStyle = p.item === i ? '#ffd84a' : '#5a64a8'; g.lineWidth = 2; g.strokeRect(sx + 1, sy + 1, 28, 28);
      g.save(); g.translate(sx + 7, sy + 23); g.rotate(-0.78); drawItem(g, i); g.restore();
      if (i === BLOCK || i === BOMB) text(String(i === BLOCK ? p.blocks : p.nbombs), sx + 28, sy + 28, 11, '#fff', 'right');
    }
    text(ITEMS[p.item], bx + 178, 82, 13, '#ffe9a0', 'left');
  });
  text(players[0].wins + ' : ' + players[1].wins, CW / 2, 36, 28);
  text('до ' + WINS_NEEDED + ' побед', CW / 2, 54, 12, '#dfe6ff');
}
function drawMenu() {
  g.fillStyle = 'rgba(10,12,28,0.72)'; g.fillRect(0, 0, CW, CH);
  text('TERRARIA', CW / 2, 150, 92, '#6bd24f'); text('1 v 1', CW / 2, 215, 54, '#ffd84a');
  const rows = [['Движение / прыжок', 'A D / W', '← → / ↑'], ['Целиться вверх / вниз', 'W / S', '↑ / ↓'], ['Использовать предмет', 'F или Пробел', '/  или Num0, правый Shift'],
    ['Сменить предмет', 'Q E или 1–5', ', .  или 6–0']];
  text('ИГРОК 1', 560, 285, 20, '#7fb0ff'); text('ИГРОК 2', 900, 285, 20, '#ff8a80');
  rows.forEach((r, i) => { const y = 322 + i * 34; text(r[0], 200, y, 18, '#dfe6ff', 'left'); text(r[1], 560, y, 18); text(r[2], 900, y, 18); });
  text('Меч — ближний бой · Лук — стрелы · Кирка — копать (руда лечит +25) · Блоки — строить · Бомба — взрыв', CW / 2, 492, 16, '#ffe9a0');
  if (Math.floor(time * 2) % 2) text('ENTER — игра вдвоём      B — против бота', CW / 2, 570, 30, '#fff');
  text('P — пауза · Esc — меню · первый до ' + WINS_NEEDED + ' побед', CW / 2, 620, 15, '#aab4e0');
}
function render() {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.drawImage(bgCv, 0, 0);
  g.fillStyle = 'rgba(255,255,255,0.85)';
  clouds.forEach(c => { g.beginPath(); g.ellipse(c.x, c.y, 60 * c.k, 18 * c.k, 0, 0, 7); g.ellipse(c.x + 34 * c.k, c.y - 12 * c.k, 36 * c.k, 18 * c.k, 0, 0, 7); g.ellipse(c.x - 30 * c.k, c.y - 6 * c.k, 30 * c.k, 14 * c.k, 0, 0, 7); g.fill(); });
  if (shake > 0) g.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  for (const t of trees) {
    const tx = t.x * TS, by = t.y * TS, ty = by - t.h * TS;
    g.fillStyle = '#7a4f2a'; g.fillRect(tx + 5, ty, 6, t.h * TS); g.fillStyle = '#5e3b1e'; g.fillRect(tx + 9, ty, 2, t.h * TS);
    g.fillStyle = '#2f8a30'; g.beginPath(); g.arc(tx + 8, ty - 4, 20, 0, 7); g.arc(tx - 6, ty + 6, 13, 0, 7); g.arc(tx + 22, ty + 6, 13, 0, 7); g.fill();
    g.fillStyle = '#49b340'; g.beginPath(); g.arc(tx + 4, ty - 9, 11, 0, 7); g.arc(tx + 19, ty + 2, 7, 0, 7); g.fill();
  }
  g.drawImage(worldCv, 0, 0);
  for (const p of players) {
    if (p.mt >= 0) { // mining cracks
      const x = (p.mt % W) * TS, y = Math.floor(p.mt / W) * TS, k = clamp(p.mp / HARD[world[p.mt]], 0, 1);
      g.fillStyle = `rgba(0,0,0,${0.15 + k * 0.45})`; g.fillRect(x, y, TS, TS);
      g.strokeStyle = 'rgba(255,255,255,0.7)'; g.lineWidth = 1; g.beginPath(); g.moveTo(x + 8, y + 8); g.lineTo(x + 8 - 7 * k, y + 8 - 6 * k); g.moveTo(x + 8, y + 8); g.lineTo(x + 8 + 7 * k, y + 8 - 3 * k); g.moveTo(x + 8, y + 8); g.lineTo(x + 8 + 2 * k, y + 8 + 7 * k); g.stroke();
    }
    if (p.target) { g.strokeStyle = p.i ? 'rgba(255,138,128,0.9)' : 'rgba(127,176,255,0.9)'; g.lineWidth = 1; g.strokeRect(p.target[0] * TS + 0.5, p.target[1] * TS + 0.5, TS - 1, TS - 1); }
  }
  for (const a of arrows) {
    const ang = Math.atan2(a.vy, a.vx);
    g.save(); g.translate(a.x, a.y); g.rotate(ang); g.globalAlpha = a.stuck ? Math.min(1, a.stuck) : 1;
    g.fillStyle = '#8a5a2b'; g.fillRect(-12, -1, 12, 2); g.fillStyle = '#e6edf5'; g.fillRect(-2, -2, 4, 4); g.fillStyle = '#d33'; g.fillRect(-14, -2, 3, 4);
    g.restore();
  }
  for (const b of bombs) {
    g.fillStyle = Math.floor(b.fuse * 10) % 2 ? '#25252c' : '#a02020'; g.beginPath(); g.arc(b.x + 4, b.y + 4, 6, 0, 7); g.fill();
    g.fillStyle = '#ffb23a'; g.fillRect(b.x + 3, b.y - 5, 2, 3); g.fillStyle = '#fff3c0'; g.fillRect(b.x + 2 + Math.random() * 2, b.y - 8, 2, 2);
  }
  if (state !== 'menu') players.forEach(drawPlayer);
  for (const p of parts) { g.globalAlpha = clamp(p.life * 2.5, 0, 1); g.fillStyle = p.color; g.fillRect(p.x, p.y, p.size, p.size); }
  g.globalAlpha = 1;
  for (const t of texts) { g.globalAlpha = clamp(t.life * 2, 0, 1); text(t.txt, t.x, t.y, 15, t.color); }
  g.globalAlpha = 1; g.setTransform(1, 0, 0, 1, 0, 0);
  if (state === 'menu') return drawMenu();
  drawHUD();
  if (state === 'play' && stateT < 1.6) { text('Раунд ' + (players[0].wins + players[1].wins + 1), CW / 2, 250, 54, '#ffd84a'); text('В бой!', CW / 2, 300, 30); }
  if (state === 'roundEnd') text(banner, CW / 2, 280, 50, '#ffd84a');
  if (state === 'pause') { g.fillStyle = 'rgba(10,12,28,0.6)'; g.fillRect(0, 0, CW, CH); text('ПАУЗА', CW / 2, 340, 64); text('P — продолжить', CW / 2, 385, 20, '#dfe6ff'); }
  if (state === 'matchEnd') {
    g.fillStyle = 'rgba(10,12,28,0.6)'; g.fillRect(0, 0, CW, CH);
    text('🏆 ' + banner, CW / 2, 320, 60, '#ffd84a'); text(players[0].wins + ' : ' + players[1].wins, CW / 2, 385, 40);
    text('ENTER — в меню', CW / 2, 440, 22, '#dfe6ff');
  }
}

/* ---------- main loop ---------- */
const STEP = 1 / 60; let last = 0, acc = 0, frames = 0;
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000 || 0); last = now;
  while (acc >= STEP) { tick(STEP); pressed.clear(); acc -= STEP; }
  render(); frames++;
  if (DEMO) document.title = JSON.stringify({ state, frames, t: +time.toFixed(1), hp: players.map(p => p.hp), wins: players.map(p => p.wins), x: players.map(p => Math.round(p.x)), arrows: arrows.length });
  requestAnimationFrame(frame);
}
window.onerror = (m, s, l) => { document.title = 'ERR: ' + m + ' @' + l; };
for (let i = 0; i < 7; i++) clouds.push({ x: Math.random() * CW, y: 40 + Math.random() * 190, s: 5 + Math.random() * 9, k: 0.6 + Math.random() * 0.8 });
players = [newPlayer(0), newPlayer(1)];
genWorld();
if (DEMO) {
  startMatch(true);
  // ?demo&ff=N fast-forwards N simulated seconds of bot-vs-bot play (headless smoke test)
  for (let n = (+params.get('ff') || 0) * 60; n > 0; n--) tick(STEP);
}
requestAnimationFrame(frame);
</script>
</body>
