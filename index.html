<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Искра Бездны</title>
<style>
  html, body { margin: 0; height: 100%; background: #020205; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16)); cursor: none; user-select: none; -webkit-user-select: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #gl { image-rendering: pixelated; }
  #crt { position: absolute; inset: 0; pointer-events: none; display: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,0.28) 3px, rgba(0,0,0,0.28) 4px), radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.45) 100%); }
  #wrap.crt #crt { display: block; }
</style>
</head>
<body>
<div id="wrap"><canvas id="gl" width="384" height="216"></canvas><canvas id="hud"></canvas><div id="crt"></div></div>
<script src="js/core.js"></script>
<script src="js/gfx.js"></script>
<script src="js/audio.js"></script>
<script src="js/art.js"></script>
<script src="js/world.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
